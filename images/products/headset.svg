<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="USB Stereo Headset illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4f6"/>
      <stop offset="1" stop-color="#e3ecf1"/>
    </linearGradient>
    <linearGradient id="headband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#384552"/>
      <stop offset="1" stop-color="#1b242c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="225" r="160" fill="#0ea5b5" opacity="0.08"/>

  <!-- Padded Headband Arch -->
  <path d="M190 240 A 130 145 0 0 1 410 240" fill="none" stroke="url(#headband)" stroke-width="26" stroke-linecap="round"/>
  <!-- Top Comfort Cushion -->
  <path d="M230 135 A 110 80 0 0 1 370 135" fill="none" stroke="#0ea5b5" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Left Earcup Assembly -->
  <!-- Outer Pivot Arm -->
  <rect x="175" y="225" width="28" height="75" rx="10" fill="#2d3742"/>
  <!-- Foam Cushion -->
  <rect x="186" y="235" width="22" height="65" rx="11" fill="#111820"/>
  <!-- Earcup Shell -->
  <rect x="160" y="232" width="30" height="70" rx="14" fill="#3a4854"/>
  <circle cx="175" cy="267" r="8" fill="#0ea5b5"/>

  <!-- Right Earcup Assembly -->
  <!-- Outer Pivot Arm -->
  <rect x="397" y="225" width="28" height="75" rx="10" fill="#2d3742"/>
  <!-- Foam Cushion -->
  <rect x="392" y="235" width="22" height="65" rx="11" fill="#111820"/>
  <!-- Earcup Shell -->
  <rect x="410" y="232" width="30" height="70" rx="14" fill="#3a4854"/>
  <circle cx="425" cy="267" r="8" fill="#0ea5b5"/>

  <!-- Boom Microphone (attached to left earcup extending forward) -->
  <path d="M175 275 Q 190 340, 270 335" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <!-- Foam Mic Capsule -->
  <rect x="265" y="323" width="32" height="20" rx="9" fill="#0f172a"/>
  <circle cx="288" cy="333" r="3" fill="#37d3c3"/>

  <!-- Audio Wave Resonance Indicator -->
  <g fill="none" stroke="#0ea5b5" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <path d="M312 325 A 16 16 0 0 1 312 341"/>
    <path d="M324 318 A 28 28 0 0 1 324 348"/>
  </g>

  <!-- USB Cable originating from bottom of left earcup -->
  <path d="M185 305 Q 185 380, 240 375 T 280 400" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- Drop Shadow -->
  <ellipse cx="300" cy="355" rx="150" ry="14" fill="#1b242c" opacity="0.10"/>
</svg>
