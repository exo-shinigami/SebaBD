<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="USB-C to HDMI Cable illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4f6"/>
      <stop offset="1" stop-color="#e3ecf1"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="225" r="160" fill="#0ea5b5" opacity="0.08"/>

  <!-- Coiled Braided Cable in Center Loop -->
  <path d="M190 280 C 130 250, 150 140, 260 140 C 370 140, 410 230, 350 290 C 290 350, 220 310, 250 250 C 280 190, 360 210, 420 230" 
        fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  <path d="M190 280 C 130 250, 150 140, 260 140 C 370 140, 410 230, 350 290 C 290 350, 220 310, 250 250 C 280 190, 360 210, 420 230" 
        fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6"/>

  <!-- Left Connector: USB-C Plug -->
  <!-- Strain Relief -->
  <rect x="180" y="270" width="20" height="18" rx="4" fill="#334155" transform="rotate(-30 190 280)"/>
  <!-- Connector Shell -->
  <rect x="145" y="285" width="45" height="26" rx="6" fill="url(#metal)" transform="rotate(-30 167 298)"/>
  <!-- Gold USB-C Tip -->
  <rect x="122" y="293" width="26" height="16" rx="4" fill="url(#gold)" transform="rotate(-30 135 301)"/>

  <!-- Right Connector: HDMI 4K Connector Head -->
  <!-- Strain Relief -->
  <rect x="410" y="222" width="22" height="22" rx="4" fill="#334155"/>
  <!-- Aluminum HDMI Shell -->
  <rect x="430" y="210" width="75" height="46" rx="8" fill="url(#metal)"/>
  <!-- HDMI Beveled Face -->
  <polygon points="505,216 532,223 532,243 505,250" fill="url(#gold)"/>
  <rect x="532" y="226" width="12" height="14" rx="2" fill="url(#gold)"/>

  <!-- 4K UHD Branding on HDMI Shell -->
  <rect x="445" y="228" width="32" height="10" rx="3" fill="#0ea5b5" opacity="0.8"/>
  <text x="461" y="236" fill="#ffffff" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">4K 60Hz</text>

  <!-- Drop Shadow -->
  <ellipse cx="300" cy="350" rx="170" ry="14" fill="#1b242c" opacity="0.10"/>
</svg>
