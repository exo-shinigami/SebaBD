<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="UPS battery backup illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4f6"/>
      <stop offset="1" stop-color="#e3ecf1"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f3b46"/>
      <stop offset="1" stop-color="#1b242c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="225" r="155" fill="#0ea5b5" opacity="0.08"/>

  <!-- tower -->
  <rect x="204" y="128" width="192" height="196" rx="14" fill="url(#case)"/>
  <rect x="204" y="128" width="192" height="42" rx="14" fill="#3a4854"/>

  <!-- outlets -->
  <g fill="#0f1720">
    <rect x="236" y="196" width="52" height="34" rx="6"/>
    <rect x="312" y="196" width="52" height="34" rx="6"/>
    <rect x="236" y="248" width="52" height="34" rx="6"/>
    <rect x="312" y="248" width="52" height="34" rx="6"/>
  </g>
  <g fill="#1b242c">
    <circle cx="254" cy="213" r="4"/><circle cx="270" cy="213" r="4"/>
    <circle cx="330" cy="213" r="4"/><circle cx="346" cy="213" r="4"/>
    <circle cx="254" cy="265" r="4"/><circle cx="270" cy="265" r="4"/>
    <circle cx="330" cy="265" r="4"/><circle cx="346" cy="265" r="4"/>
  </g>

  <!-- status display -->
  <rect x="248" y="146" width="104" height="26" rx="6" fill="#37d3c3" opacity="0.85"/>
  <g fill="#1b242c" opacity="0.7">
    <rect x="260" y="156" width="10" height="6" rx="2"/>
    <rect x="276" y="156" width="10" height="6" rx="2"/>
    <rect x="292" y="156" width="10" height="6" rx="2"/>
    <rect x="308" y="156" width="10" height="6" rx="2"/>
  </g>

  <!-- power cord -->
  <path d="M300 324 v22 q0 14 -14 14 h-46" stroke="#5d6b77" stroke-width="7" fill="none" stroke-linecap="round"/>

  <ellipse cx="300" cy="352" rx="132" ry="14" fill="#1b242c" opacity="0.08"/>
</svg>
