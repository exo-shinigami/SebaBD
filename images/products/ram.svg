<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Desktop RAM Memory Module illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4f6"/>
      <stop offset="1" stop-color="#e3ecf1"/>
    </linearGradient>
    <linearGradient id="heatspreader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334150"/>
      <stop offset="0.4" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldPins" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="225" r="160" fill="#0ea5b5" opacity="0.08"/>

  <!-- Main Memory Module Body (DIMM Stick) -->
  <!-- Dark Matte PCB Base -->
  <rect x="70" y="160" width="460" height="120" rx="8" fill="#134e4a" stroke="#042f2e" stroke-width="2"/>

  <!-- Aggressive Aluminum Heat Spreader (FURY Gaming Style) -->
  <polygon points="75,160 140,140 280,140 300,150 440,150 525,160 525,248 75,248" fill="url(#heatspreader)"/>
  <!-- Heatspreader Vent Cuts -->
  <polygon points="120,155 160,155 150,170 110,170" fill="#0ea5b5" opacity="0.6"/>
  <polygon points="180,155 220,155 210,170 170,170" fill="#0ea5b5" opacity="0.6"/>
  <polygon points="240,155 280,155 270,170 230,170" fill="#0ea5b5" opacity="0.6"/>

  <!-- Center Metallic Badge (DDR4 3200MHz) -->
  <rect x="230" y="190" width="140" height="36" rx="6" fill="#1e293b" stroke="#0ea5b5" stroke-width="2"/>
  <text x="300" y="213" fill="#ffffff" font-size="14" font-family="sans-serif" font-weight="900" letter-spacing="2" text-anchor="middle">DDR4 3200</text>
  <rect x="245" y="220" width="110" height="2" fill="#37d3c3"/>

  <!-- Heat Sink Angular Fin Grooves -->
  <line x1="100" y1="200" x2="210" y2="200" stroke="#475569" stroke-width="3"/>
  <line x1="90" y1="215" x2="200" y2="215" stroke="#475569" stroke-width="2"/>
  <line x1="390" y1="200" x2="500" y2="200" stroke="#475569" stroke-width="3"/>
  <line x1="400" y1="215" x2="510" y2="215" stroke="#475569" stroke-width="2"/>

  <!-- DRAM Chips Sub-layer hints on exposed sides -->
  <rect x="80" y="235" width="24" height="12" rx="2" fill="#0f172a"/>
  <rect x="496" y="235" width="24" height="12" rx="2" fill="#0f172a"/>

  <!-- DDR4 Edge Connector Gold Fingers with Notch -->
  <!-- Left Pin Strip -->
  <rect x="75" y="255" width="200" height="25" fill="url(#goldPins)"/>
  <!-- Key Notch (DDR4 off-center notch around x=280) -->
  <rect x="275" y="250" width="16" height="35" rx="3" fill="#134e4a"/>
  <!-- Right Pin Strip -->
  <rect x="291" y="255" width="234" height="25" fill="url(#goldPins)"/>

  <!-- Individual Pin Lines Pattern -->
  <g stroke="#92400e" stroke-width="1.5">
    <!-- Sample individual pin separator slashes -->
    <line x1="85" y1="255" x2="85" y2="280"/><line x1="100" y1="255" x2="100" y2="280"/><line x1="115" y1="255" x2="115" y2="280"/>
    <line x1="130" y1="255" x2="130" y2="280"/><line x1="145" y1="255" x2="145" y2="280"/><line x1="160" y1="255" x2="160" y2="280"/>
    <line x1="175" y1="255" x2="175" y2="280"/><line x1="190" y1="255" x2="190" y2="280"/><line x1="205" y1="255" x2="205" y2="280"/>
    <line x1="220" y1="255" x2="220" y2="280"/><line x1="235" y1="255" x2="235" y2="280"/><line x1="250" y1="255" x2="250" y2="280"/>
    <line x1="265" y1="255" x2="265" y2="280"/>
    <line x1="305" y1="255" x2="305" y2="280"/><line x1="320" y1="255" x2="320" y2="280"/><line x1="335" y1="255" x2="335" y2="280"/>
    <line x1="350" y1="255" x2="350" y2="280"/><line x1="365" y1="255" x2="365" y2="280"/><line x1="380" y1="255" x2="380" y2="280"/>
    <line x1="395" y1="255" x2="395" y2="280"/><line x1="410" y1="255" x2="410" y2="280"/><line x1="425" y1="255" x2="425" y2="280"/>
    <line x1="440" y1="255" x2="440" y2="280"/><line x1="455" y1="255" x2="455" y2="280"/><line x1="470" y1="255" x2="470" y2="280"/>
    <line x1="485" y1="255" x2="485" y2="280"/><line x1="500" y1="255" x2="500" y2="280"/><line x1="515" y1="255" x2="515" y2="280"/>
  </g>

  <!-- Drop Shadow -->
  <ellipse cx="300" cy="335" rx="220" ry="14" fill="#1b242c" opacity="0.10"/>
</svg>
