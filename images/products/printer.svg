<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Printer illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4f6"/>
      <stop offset="1" stop-color="#e3ecf1"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3b46"/>
      <stop offset="1" stop-color="#1b242c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="225" r="160" fill="#0ea5b5" opacity="0.08"/>

  <!-- paper coming out of the top -->
  <rect x="212" y="104" width="176" height="86" rx="6" fill="#ffffff" stroke="#c8d4dc" stroke-width="3"/>
  <rect x="236" y="126" width="128" height="8" rx="4" fill="#cfdae1"/>
  <rect x="236" y="146" width="104" height="8" rx="4" fill="#cfdae1"/>
  <rect x="236" y="166" width="116" height="8" rx="4" fill="#cfdae1"/>

  <!-- printer body -->
  <rect x="168" y="182" width="264" height="118" rx="14" fill="url(#body)"/>
  <rect x="168" y="182" width="264" height="30" rx="14" fill="#3a4854"/>
  <rect x="196" y="232" width="120" height="40" rx="8" fill="#0ea5b5" opacity="0.18"/>
  <circle cx="392" cy="226" r="9" fill="#37d3c3"/>
  <rect x="356" y="250" width="44" height="6" rx="3" fill="#5d6b77"/>

  <!-- output tray with a sheet -->
  <rect x="196" y="300" width="208" height="22" rx="6" fill="#2a353f"/>
  <rect x="214" y="286" width="172" height="26" rx="4" fill="#ffffff" stroke="#c8d4dc" stroke-width="3"/>

  <!-- stand shadow -->
  <ellipse cx="300" cy="352" rx="150" ry="14" fill="#1b242c" opacity="0.08"/>
</svg>
